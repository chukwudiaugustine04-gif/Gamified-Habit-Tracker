kind = "web"
previewPath = "/"
title = "Habit Tracker"
description = "A responsive gamified habit tracker for scheduling daily goals, earning points in sequence, tracking reward tiers, and unlocking milestones. Includes light, dark, and vibrant themes plus customizable avatars, with local persistence."
version = "1.0.0"
id = "artifacts/habit-tracker"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20387

[services.development]
run = "pnpm --filter @workspace/habit-tracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/habit-tracker", "run", "build" ]
serve = "static"
publicDir = "artifacts/habit-tracker/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20387"
BASE_PATH = "/"
